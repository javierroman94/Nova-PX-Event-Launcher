# Compila los instaladores y los publica en "Releases" cada vez que subes una versión nueva.
# Los launchers instalados detectan ese Release y se actualizan solos.
#
# Cómo publicar una versión (desde tu computadora):
#   npm version patch
#   git push --follow-tags
name: Publicar versión

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      # La versión del programa sale SIEMPRE de la etiqueta (v1.0.12 -> 1.0.12).
      # Así nunca puede haber una etiqueta que no coincida con package.json.
      - name: Fijar la versión según la etiqueta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "La etiqueta '$GITHUB_REF_NAME' no tiene el formato vX.Y.Z"; exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # La clave de CurseForge (opcional) vive en los "Secrets" del repositorio, no en el código público.
      - name: Insertar la clave de CurseForge
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CURSEFORGE_API_KEY" ]; then
            node -e "const fs=require('fs');const p='config/launcher.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.curseforgeApiKey=process.env.CURSEFORGE_API_KEY;fs.writeFileSync(p,JSON.stringify(c,null,2))"
            echo "Clave de CurseForge insertada."
          else
            echo "Sin clave de CurseForge: esa pestaña quedará desactivada."
          fi

      - name: Compilar y publicar
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
