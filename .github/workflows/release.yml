# Compila los instaladores y los publica en "Releases" cada vez que subes una versión nueva.
# Los launchers instalados detectan ese Release y se actualizan solos.
#
# Cómo publicar una versión (desde tu computadora):
#   npm version patch
#   git push --follow-tags
name: Publicar versión

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Antes de compilar nada: la etiqueta tiene que coincidir con package.json y
  # apuntar a un commit nuevo (no al de la versión anterior).
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial y etiquetas completas para comparar con versiones anteriores

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar la etiqueta
        run: node tools/verificar-etiqueta.js "$GITHUB_REF_NAME"

  release:
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar y publicar
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
