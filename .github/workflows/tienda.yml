# Genera el paquete MSIX para Microsoft Store (Partner Center).
# Se ejecuta a mano: Actions → "Paquete para Microsoft Store" → Run workflow.
# Los tres datos de identidad salen de Partner Center → tu app → Gestión de productos → Identidad del producto.
name: Paquete para Microsoft Store

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity/Name (ej. 12345Nombre.NovaPXEventLauncher)'
        required: true
      publisher:
        description: 'Package/Identity/Publisher (ej. CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)'
        required: true
      publisher_display_name:
        description: 'Package/Properties/PublisherDisplayName'
        required: true

# Solo lee el código y sube el paquete como artefacto: el token no necesita escribir nada.
permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - run: npm install
      - name: Compilar MSIX
        run: npx electron-builder --win appx --publish never --config electron-builder.store.js
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nova-px-msix
          path: dist/*.appx
