# Renueva la lista del loader Nova (data/nova-loader.json) una vez por semana:
# busca en Modrinth versiones nuevas de los mods de rendimiento y deja solo las que no chocan entre sí.
# Si algo cambió, sube la lista a main (la versión de Nova sube sola). No publica una versión del launcher.
name: Lista del loader Nova

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-loader
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Armar la lista
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/nova-loader.js
      - name: Probar la lista
        run: node test/nova-loader.test.js
      - name: Subir si cambió
        run: |
          if git diff --quiet -- data/nova-loader.json; then echo "Sin cambios."; exit 0; fi
          v="$(node -p "require('./data/nova-loader.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nova-loader.json
          git commit -m "Lista del loader Nova $v"
          git pull --rebase -q origin main
          git push origin HEAD:main
