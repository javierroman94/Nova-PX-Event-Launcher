<!doctype html>
<html lang="es"><head><meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
<title>Pexy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, "Segoe UI", sans-serif; user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; padding: 6px; }
  #bubble { max-width: 230px; margin: 0 8px 6px 0; padding: 8px 11px; border-radius: 12px; background: rgba(15, 18, 32, .92); color: #f2f4ff; font-size: 13px; line-height: 1.3; border: 1px solid rgba(255, 255, 255, .18); box-shadow: 0 6px 18px rgba(0, 0, 0, .4); transition: opacity .25s; }
  #bubble[hidden] { display: block; opacity: 0; }
  canvas { image-rendering: pixelated; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
</style></head>
<body><div id="wrap"><div id="bubble" hidden></div><canvas id="c" width="66" height="96"></canvas></div>
<script src="overlay.js"></script></body></html>
